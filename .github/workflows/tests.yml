name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Test
        run: pytest -q

  jax:
    # the JAX twins against their numpy definitions, with the jax extra installed, and the harmonic basis against
    # DIPY's (an oracle installed here, never a dependency)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,jax]" dipy
      - name: Test
        run: pytest -q -rs --durations=10

  parity-move:
    # The forms dmipy-analytic receives (dmrai-lab/dmipy-sim#834) are checked value for value: the calls of
    # tests/parity_move recorded with dmipy-replay and dmipy-sim at the commits before the move (reference/manifest.json
    # names them), then the same calls on this commit, both on this runner (a sum's last bit is the BLAS build's and the
    # CPU's, so a record is compared only with one taken in its own environment). The committed reference is compared
    # with this runner's record for information. A group whose forms have not moved yet is reported pending.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the packages before the move
        run: |
          python -m pip install --upgrade pip
          ref() { python -c "import json, sys; print(json.load(open('tests/parity_move/reference/manifest.json'))['packages'][sys.argv[1]]['commit'])" "$1"; }
          pip install "dmipy-replay @ git+https://github.com/dmrai-lab/dmipy-replay@$(ref dmipy-replay)"
          pip install "dmipy-sim @ git+https://github.com/dmrai-lab/dmipy-sim@$(ref dmipy-sim)"
      - name: Record before the move
        run: python tests/parity_move/record_reference.py "$RUNNER_TEMP/before"
      - name: The committed reference against this runner's record
        run: python tests/parity_move/check_reference.py tests/parity_move/reference --against "$RUNNER_TEMP/before" || echo "::notice title=parity-move::the committed reference differs from this runner's record (another environment)"
      - name: Install this commit
        run: pip install --no-deps -e .
      - name: Check this commit against the record
        run: python tests/parity_move/check_reference.py "$RUNNER_TEMP/before" --require-all

